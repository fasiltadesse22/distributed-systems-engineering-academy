name: Academy V0.1 verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    name: Content, TypeScript, Simulation, Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate roadmap and blueprint (no dependencies)
        run: node scripts/check-content.mjs
      - name: Progress governance fixture tests (no dependencies)
        run: node --test scripts/test-progress-governance.mjs
      - name: Validate active lesson status and historical labeling
        run: node scripts/check-progress-governance.mjs
      - name: Verify immutable manuscript, coverage and internal links
        run: node scripts/check-academy-governance.mjs
      - name: Academy governance validator fixture tests
        run: node --test scripts/test-academy-governance.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Simulation unit tests
        run: npm run test
      - name: Production build
        run: npm run build
